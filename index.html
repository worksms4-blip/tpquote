<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
THEVAR POWER - Solar EPC Software
</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Montserrat',sans-serif;
background:#eef2f0;
min-height:100vh;
padding:30px;
}

.container{
max-width:1300px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.brand{
display:flex;
align-items:center;
gap:18px;
}

.logo{
width:72px;
height:72px;
border-radius:20px;
background:#2f7d44;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:800;
color:white;
box-shadow:0 10px 25px rgba(47,125,68,0.25);
}

.brand-text h1{
font-size:32px;
color:#2f7d44;
line-height:1;
}

.brand-text p{
margin-top:5px;
color:#666;
font-size:13px;
}

.main-card{
background:white;
border-radius:26px;
overflow:hidden;
box-shadow:0 20px 60px rgba(0,0,0,0.08);
display:grid;
grid-template-columns:1.1fr 0.9fr;
}

.form-side{
padding:40px;
max-height:95vh;
overflow:auto;
}

.summary-side{
background:#2f7d44;
padding:40px;
color:white;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.section-title{
font-size:30px;
font-weight:700;
margin-bottom:30px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:30px;
}

.full-width{
grid-column:1/3;
}

.form-group label{
display:block;
margin-bottom:10px;
font-size:14px;
font-weight:600;
color:#333;
}

input,
textarea,
select{
width:100%;
padding:15px 16px;
border:1px solid #ddd;
border-radius:14px;
font-size:15px;
font-family:'Montserrat',sans-serif;
transition:0.3s;
background:white;
}

input:focus,
textarea:focus,
select:focus{
outline:none;
border-color:#2f7d44;
box-shadow:0 0 0 4px rgba(47,125,68,0.12);
}

textarea{
min-height:100px;
resize:vertical;
}

.material-section{
margin-top:35px;
padding:25px;
border:1px solid #e5e5e5;
border-radius:20px;
background:#fafcfa;
}

.material-title{
font-size:22px;
font-weight:700;
margin-bottom:20px;
color:#2f7d44;
}

.material-row{
display:grid;
grid-template-columns:2fr 1fr auto;
gap:14px;
margin-bottom:14px;
align-items:center;
}

.add-btn{
padding:14px 18px;
border:none;
background:#2f7d44;
color:white;
font-weight:700;
border-radius:12px;
cursor:pointer;
transition:0.3s;
}

.add-btn:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(47,125,68,0.2);
}

.remove-btn{
width:45px;
height:45px;
border:none;
border-radius:12px;
background:#ff4d4d;
color:white;
font-size:20px;
cursor:pointer;
}

.generate-btn{
width:100%;
margin-top:35px;
padding:20px;
border:none;
background:#2f7d44;
color:white;
font-size:18px;
font-weight:700;
border-radius:16px;
cursor:pointer;
transition:0.3s;
}

.generate-btn:hover{
transform:translateY(-2px);
box-shadow:0 12px 25px rgba(47,125,68,0.25);
}

.summary-title{
font-size:30px;
font-weight:700;
margin-bottom:30px;
}

.summary-box{
background:rgba(255,255,255,0.08);
border-radius:20px;
padding:30px;
}

.summary-item{
display:flex;
justify-content:space-between;
margin-bottom:20px;
font-size:16px;
}

.total-row{
border-top:1px solid rgba(255,255,255,0.2);
padding-top:20px;
font-size:28px;
font-weight:700;
}

.info-card{
margin-top:30px;
padding:25px;
border-radius:20px;
background:rgba(255,255,255,0.08);
}

.info-card h3{
margin-bottom:12px;
font-size:18px;
}

.info-card p{
font-size:14px;
line-height:1.9;
}

@media(max-width:950px){

.main-card{
grid-template-columns:1fr;
}

.form-grid{
grid-template-columns:1fr;
}

.full-width{
grid-column:auto;
}

.material-row{
grid-template-columns:1fr;
}

.form-side{
max-height:none;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="brand">

<div class="logo">
⚡
</div>

<div class="brand-text">

<h1>THEVAR POWER</h1>

<p>
Professional Solar EPC Software
</p>

</div>

</div>

</div>

<div class="main-card">

<div class="form-side">

<h2 class="section-title">
Create EPC Quotation
</h2>

<div class="form-grid">

<div class="form-group">

<label>Quotation Number</label>

<input
id="quotationNumberInput"
type="text"
>

</div>

<div class="form-group">

<label>Quotation Date</label>

<input
id="quotationDateInput"
type="date"
>

</div>

<div class="form-group">

<label>Customer Name</label>

<input
id="customerNameInput"
type="text"
placeholder="Enter customer name"
>

</div>

<div class="form-group">

<label>Subsidy Amount</label>

<input
id="subsidyInput"
type="number"
value="78000"
>

</div>

<div class="form-group full-width">

<label>Customer Address</label>

<textarea
id="customerAddressInput"
placeholder="Enter customer address"
></textarea>

</div>

</div>


<div class="material-section">

<h3 class="material-title">
Solar Panels
</h3>

<div id="panelContainer"></div>

<button
class="add-btn"
onclick="addMaterialRow(
'panelContainer',
'Solar Panel'
)"
>
+ Add Panel
</button>

</div>


<div class="material-section">

<h3 class="material-title">
Inverters
</h3>

<div id="inverterContainer"></div>

<button
class="add-btn"
onclick="addMaterialRow(
'inverterContainer',
'Inverter'
)"
>
+ Add Inverter
</button>

</div>


<div class="material-section">

<h3 class="material-title">
Materials
</h3>

<div id="materialContainer"></div>

<button
class="add-btn"
onclick="addMaterialRow(
'materialContainer',
'Material'
)"
>
+ Add Material
</button>

</div>


<div class="material-section">

<h3 class="material-title">
Charges
</h3>

<div id="chargeContainer"></div>

<button
class="add-btn"
onclick="addMaterialRow(
'chargeContainer',
'Charge'
)"
>
+ Add Charges
</button>

</div>


<button
class="generate-btn"
onclick="generateQuotation()"
>
Generate Professional BOQ
</button>

</div>

<div class="summary-side">

<div>

<h2 class="summary-title">
Quotation Summary
</h2>

<div class="summary-box">

<div class="summary-item">
<span>Subtotal</span>
<span id="subtotalText">₹0</span>
</div>

<div class="summary-item">
<span>GST (18%)</span>
<span id="gstText">₹0</span>
</div>

<div class="summary-item">
<span>Subsidy</span>
<span id="subsidyText">₹78000</span>
</div>

<div class="summary-item total-row">
<span>Total</span>
<span id="liveTotal">₹0</span>
</div>

</div>

</div>

<div class="info-card">
<p>

✔ Thevar Power Private Limited 

</p>

</div>

</div>

</div>

</div>

<script src="pricing.js"></script>
<script src="app.js"></script>

</body>
</html>
